name: Build and publish Docker image

# Required GitHub Actions secrets:
#   DOCKERHUB_USERNAME: Docker Hub account with permission to push
#   DOCKERHUB_TOKEN: Docker Hub access token with write permission
# Optional secret:
#   DOCKERHUB_REPOSITORY: full image name (defaults to <username>/job-scraper)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE: ${{ secrets.DOCKERHUB_REPOSITORY || format('{0}/job-scraper', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Docker Hub configuration
        shell: bash
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME Actions secret}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN Actions secret}"
          : "${IMAGE:?Set the DOCKERHUB_REPOSITORY Actions secret}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image and run checks
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
