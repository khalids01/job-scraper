[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-scraper"
version = "0.5.0"
description = "Standalone job collection API for Job Agent"
requires-python = ">=3.12"
dependencies = [
  "fastembed>=0.7,<0.8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.9,<3",
  "feedparser>=6.0,<7",
  "redis>=5,<8",
  "pymongo>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
