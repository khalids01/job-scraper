services:
  scraper:
    image: ${SCRAPER_IMAGE:?Set SCRAPER_IMAGE to your published Docker Hub image with tag}
    pull_policy: always
    restart: unless-stopped
    networks:
      - dokploy-network
    expose:
      - "8000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in Dokploy Environment}
      MAX_REQ_PER_MIN: ${MAX_REQ_PER_MIN:-120}
      MONGODB_URL: ${MONGODB_URL:?Set MONGODB_URL in Dokploy Environment}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in Dokploy Environment}
      SOURCES: ${SOURCES:-remotive,arbeitnow,himalayas,remoteok,jobicy,workingnomads,reallyremote,remotejobsorg,weworkremotely,realworkfromanywhere,nodesk,jobspresso,authenticjobs,larajobs,vuejobs,wordpress,findjobit,cryptojobslist,cryptocurrencyjobs,fossjobs,landingjobs,hasjob,remotefirstjobs}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-21600}
      MAX_JOBS: ${MAX_JOBS:-500}
      MAX_PAGES: ${MAX_PAGES:-5}
      SEARCH_TERMS: ${SEARCH_TERMS:-typescript,full stack,react,node.js,frontend}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
